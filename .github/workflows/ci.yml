name: AL-BAHR HORIZON OS CI & APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-and-security-tests:
    name: Backend API, Deterministic Rules, Smart Assignment & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run typecheck
      - run: npm test

  react-build-and-apk-release:
    name: React Client Tests, Vite Build, Android APK & GitHub Release
    runs-on: ubuntu-latest
    needs: api-and-security-tests
    defaults:
      run:
        working-directory: apps/horizon_one
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install React dependencies
        run: npm install

      - name: Run React TypeScript check & automated tests
        run: |
          npm run typecheck
          npm test

      - name: Build production React bundle & Android Release APK
        run: |
          chmod +x android/gradlew
          npm run build:apk
          cp android/app/build/outputs/apk/release/app-release.apk HORIZON-ONE-latest.apk
          sha256sum HORIZON-ONE-latest.apk > SHA256SUMS.txt

      - name: Upload APK Artifact to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: HORIZON-ONE-android-apk
          path: |
            apps/horizon_one/HORIZON-ONE-latest.apk
            apps/horizon_one/SHA256SUMS.txt

      - name: Publish APK to GitHub Releases (latest-apk)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "AL-BAHR HORIZON ONE — Latest React Android APK (Build #${{ github.run_number }})"
          body: |
            ### AL-BAHR HORIZON OS (`HORIZON ONE`) — Automated React Android APK Release
            - **Stack:** React 19 + TypeScript + Vite + Tailwind CSS + Android WebView APK
            - **Commit:** `${{ github.sha }}`
            - **Build Number:** `#${{ github.run_number }}`
            - **Download:** Tap **`HORIZON-ONE-latest.apk`** under **Assets** below to install on Android.
          prerelease: false
          overwrite_files: true
          files: |
            apps/horizon_one/HORIZON-ONE-latest.apk
            apps/horizon_one/SHA256SUMS.txt

      - name: Publish Versioned APK Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "AL-BAHR HORIZON ONE ${{ github.ref_name }}"
          generate_release_notes: true
          overwrite_files: true
          files: |
            apps/horizon_one/HORIZON-ONE-latest.apk
            apps/horizon_one/SHA256SUMS.txt
