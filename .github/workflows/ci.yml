name: AL-BAHR HORIZON OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-api-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  flutter-client-and-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/horizon_one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
