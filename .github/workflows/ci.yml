name: AL-BAHR HORIZON OS CI & APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-api-and-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test

  flutter-client-and-apk:
    runs-on: ubuntu-latest
    needs: [backend-api-and-security]
    defaults:
      run:
        working-directory: apps/horizon_one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Prepare release APK & checksum
        shell: bash
        run: |
          mkdir -p ../../release-artifacts
          SHORT_SHA="${GITHUB_SHA::7}"
          cp build/app/outputs/flutter-apk/app-release.apk "../../release-artifacts/HORIZON-ONE-latest.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "../../release-artifacts/HORIZON-ONE-${SHORT_SHA}.apk"
          (cd ../../release-artifacts && sha256sum HORIZON-ONE-*.apk > SHA256SUMS.txt)
      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: horizon-one-apk
          path: release-artifacts/
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ../..
          SHORT_SHA="${GITHUB_SHA::7}"
          CHECKSUM=$(grep "HORIZON-ONE-latest.apk" release-artifacts/SHA256SUMS.txt | awk '{print $1}')
          NOTES=$(printf "Automated HORIZON ONE Android APK build from commit \`%s\` (Zero-AI deterministic runtime).\n\n- **File:** \`HORIZON-ONE-latest.apk\`\n- **SHA-256:** \`%s\`\n- **Verified:** Backend unit/integration/security tests + Flutter analyze & widget tests passed." "${SHORT_SHA}" "${CHECKSUM}")

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              gh release upload "${TAG}" "release-artifacts/HORIZON-ONE-${SHORT_SHA}.apk" release-artifacts/HORIZON-ONE-latest.apk release-artifacts/SHA256SUMS.txt --clobber
            else
              gh release create "${TAG}" "release-artifacts/HORIZON-ONE-${SHORT_SHA}.apk" release-artifacts/HORIZON-ONE-latest.apk release-artifacts/SHA256SUMS.txt --target "${GITHUB_SHA}" --title "HORIZON ONE ${TAG}" --notes "${NOTES}" --latest
            fi
          else
            if gh release view "latest-apk" >/dev/null 2>&1; then
              gh release edit "latest-apk" --title "HORIZON ONE Latest APK (${SHORT_SHA})" --notes "${NOTES}"
              gh release upload "latest-apk" release-artifacts/HORIZON-ONE-latest.apk release-artifacts/SHA256SUMS.txt --clobber
            else
              gh release create "latest-apk" release-artifacts/HORIZON-ONE-latest.apk release-artifacts/SHA256SUMS.txt --target "${GITHUB_SHA}" --title "HORIZON ONE Latest APK (${SHORT_SHA})" --notes "${NOTES}" --latest
            fi
          fi
